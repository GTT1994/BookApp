name: BookApp

options:
  bundleIdPrefix: com.gtt1994
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

targets:
  BookApp:
    type: application
    platform: iOS
    sources:
      - path: BookApp
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: BookApp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "BookApp uses your camera to scan book spines and barcodes so it can identify books and add them to your shelf."
    entitlements:
      path: Generated/BookApp.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - "iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)"
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gtt1994.BookApp
        PRODUCT_NAME: BookApp
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  BookApp:
    build:
      targets:
        BookApp: all
    run:
      config: Debug
    archive:
      config: Release
